[station]
name = WX-Station Raspberry Pi 4
altitude_m = 450.0

[sensor]
bus = 1
# I2C-Adresse: "auto", 0x76 oder 0x77
address = auto
# Anzahl Burst-Samples pro Intervall für Medianfilter
samples = 3
# Pause zwischen Burst-Samples in Sekunden
sample_delay = 0.5

[collector]
# Messintervall in Sekunden (5 Minuten)
interval_s = 300
ram_cache_path = /dev/shm/wx_current.json
rrd_path = /home/pi/WX-Station/data/wx_station.rrd

[tcp]
enabled = true
host = 0.0.0.0
port = 4001
# "plaintext" (TEMP:..;HUM:..) oder "json"
format = plaintext

[web]
host = 0.0.0.0
port = 8080
# Browser-Polling-Intervall für Live-Daten in Sekunden
refresh_interval_s = 15
# Titel auf dem Web-GUI (durch Operator anpassbar)
title = WX-Station Wetter Dashboard
# Farbschema: "dark" oder "light"
theme = dark
