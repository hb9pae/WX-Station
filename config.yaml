station:
  name: "WX-Station Raspberry Pi 4"
  altitude_m: 450.0  # Stationshöhe in Metern über Meer für QNH-Kompensation

sensor:
  bus: 1             # I2C Busnummer (/dev/i2c-1)
  address: "auto"    # "auto", 0x76 oder 0x77
  samples: 3         # Anzahl Burst-Samples pro Intervall für Medianfilter
  sample_delay: 0.5  # Pause zwischen Burst-Samples in Sekunden

collector:
  interval_s: 300    # Messintervall in Sekunden (5 Minuten)
  ram_cache_path: "/dev/shm/wx_current.json"
  rrd_path: "/home/pi/WX-Station/data/wx_station.rrd"

tcp:
  enabled: true
  host: "0.0.0.0"
  port: 4001
  format: "plaintext" # "plaintext" (TEMP:..;HUM:..) oder "json"

web:
  host: "0.0.0.0"
  port: 8080
  refresh_interval_s: 15 # Browser-Polling-Intervall für Live-Daten in Sekunden

